<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
    <h1>Student Registration Form</h1>
    <form action="#" method="post">
        <p> 
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required placeholder="Enter your Name">
        </p>
        <p>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
        </p>
        <p>
            <label for="phone">Phone:</label>
            <input type="tel" id="phone" name="phone" inputmode="numeric" maxlength="10" pattern="[0-9]{10}" placeholder="10 digits">
        </p>
        <p>
            <label for="password"> Password</label>
            <input type="password" id="password" name="password" minlength="4" maxlength="8" required>
        </p>
        <fieldset>
            <legend>Gender</legend>
            <label><input type="radio" name="gender" value="male">Male</label>
            <label><input type="radio" name="gender" value="male">Female</label>
            <label><input type="radio" name="gender" value="male">Other</label>

        </fieldset>
        <p>
            <label for="course">course:</label>
            <select name="course" id="course" required>
                <option value="">--Select--</option>
                <option >B.Tech CSE</option>
                <option >BCA</option>    
                <option >B.Sc IT</option>

            </select>
        </p>
        <p>
            <label><input type="checkbox" name="terms" required>I agree the terms and conditions</label>
        </p>
        <button type="submit">Register</button>
        <button type="reset">Clear</button>
    </form>
</body>
</html>
