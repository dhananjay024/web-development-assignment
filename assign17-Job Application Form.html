<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
</head>
<body>
    <h1>Job Application Form</h1>
    <form action="#" method="post" enctype="multipart/form-data">
        <section>
            <fieldset>
                <legend>Personal Details</legend>
                <p><label for="name">Full Name </label><input type="text" id="name" name="name" required ></p>
                <p><label for="email">E.mail </label><input type="email" id="email" name="email" required ></p>
                <p><label for="phone">phone </label><input type="tel" id="phone" name="phone" maxlength="10" part="[0-9]{10}" inputmode="numeric" ></p>
                <p><label for="date">Date of birth </label><input type="date" id="date" name="date" required ></p>
                <p><label for="Portfolio">Portfolio URL </label><input type="url" id="Portfolio" name="website" required placeholder="https://"></p>
                <p><label for="pass">Create Password </label><input type="password" id="pass" name="password" minlength="4" maxlength="12" required ></p>
            </fieldset>
        </section>

        <fieldset>
            <legend>Job details</legend>
            <p><label for="pos">Position
                <select name="position" id="pos">
                    <option >Front-End Developer</option>
                    <option >UI Designer</option>
                    <option >QA tester</option>
                    <option >web Developer</option>
                </select></label></p>
                <p><label for="joining">Earliest joining date </label><input type="date" id="joining" name="joining" required ></p>
                <p><label for="slot">Interview slot </label><input type="date" id="slot" name="slot" required ></p>
                <p><label for="month">Preferred start month </label><input type="month" id="month" name="month" required ></p>
                <p><label for="week">Preferred start week </label><input type="week" id="week" name="week" required ></p>
                <p><label for="call">Best call time </label><input type="time" id="call" name="time" required ></p>
                <p><label for="exp">Years of experience </label><input type="number" id="exp" name="exp" min="2" max="20" ></p>
                <p><label for="sal">Expected salary (₹LPA) </label><input type="range" id="sal" name="salary" required ></p>
                <p><label for="colour">Favourite colour </label><input type="color" id="colour" name="colour" value="green" required ></p>
                <p><label for="sk">Skills (type or pick)
        <input list="skills" id="sk" name="skill">
        <datalist id="skills">
            <option value="HTML"></option>
            <option value="CSS"></option>
            <option value="JavaScript"></option>
            <option value="Git"></option>
            <option value="DSA"></option>
        </datalist></label></p>
        <p><label for="search">Search company policy</label><input type="search" id="search" name="search"></p>
        </fieldset>

        <fieldset>
            <legend>Work mode</legend>
            <label><input type="radio" name="mode" value="onsite">On-site</label>
            <label><input type="radio" name="mode" value="remote">Remote</label>
            <label><input type="radio" name="mode" value="hybrid">Hybrid</label>
        </fieldset>

        <fieldset>
            <legend>Technologies known</legend>
            <label><input type="checkbox" name="tech" value="html">HTML</label>
            <label><input type="checkbox" name="tech" value="css">CSS</label>
            <label><input type="checkbox" name="tech" value="js">JavaScript</label>
        </fieldset>

        <p><label for="cv">Upload resume <input type="file" id="cv" name="resume" accept="pdf"></label></p>

        <p><label for="cover">Cover letter<br>
        <textarea id="cover" name="cover" rows="5" cols="50" maxlength="500"></textarea></label></p>

        
    <input type="hidden" name="source" value="careers-page">
    <p><label><input type="checkbox" name="agree" required> I confirm that the information is correct</label></p>

    
    <input type="submit" value="Apply now">
    <input type="reset" value="Reset">
    <input type="button" value="Print" onclick="window.print()">
    </form>
</body>
</html>
